<!doctype html>
<html><head><meta charset="utf-8"><title>card render test</title>
<style>body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:16px;max-width:480px}</style>
</head><body>
<rtlplayground-card id="card"></rtlplayground-card>
<script type="module">
import "../rtlplayground-card.js";

const DEV = "dev-rtl", POE = "poe-dev";
const reg = [];
const st = {};
function add(entity_id, device_id, platform, name, state, attrs = {}) {
  reg.push({ entity_id, device_id, platform, name });
  st[entity_id] = { entity_id, state, attributes: { friendly_name: name, ...attrs } };
}
const ports = {
  1: { link: "on", speed: "1000M", rate: [44, 27] },
  2: { link: "on", speed: "2.5G", rate: [0, 0] },
  3: { link: "off", speed: "unknown", rate: [0, 0] },
  4: { link: "on", speed: "2.5G", rate: [1200, 800] },
  5: { link: "off", speed: "unknown", rate: [0, 0] },
  6: { link: "off", speed: "unknown", rate: [0, 0] },
};
for (const [n, p] of Object.entries(ports)) {
  add(`sensor.p${n}_speed`, DEV, "rtlplayground", `Port ${n} link speed`, p.speed);
  add(`binary_sensor.p${n}_link`, DEV, "rtlplayground", `Port ${n} link`, p.link);
  add(`sensor.p${n}_tx_rate`, DEV, "rtlplayground", `Port ${n} tx rate`, String(p.rate[0]));
  add(`sensor.p${n}_rx_rate`, DEV, "rtlplayground", `Port ${n} rx rate`, String(p.rate[1]));
  add(`sensor.p${n}_tx`, DEV, "rtlplayground", `Port ${n} tx packets`, "1000");
  add(`sensor.p${n}_rx`, DEV, "rtlplayground", `Port ${n} rx packets`, "900");
  add(`sensor.p${n}_txb`, DEV, "rtlplayground", `Port ${n} tx bad packets`, "0");
  add(`sensor.p${n}_rxb`, DEV, "rtlplayground", `Port ${n} rx bad packets`, "0");
  add(`sensor.p${n}_macs`, DEV, "rtlplayground", `Port ${n} mac addresses learned`, "2");
}
add("sensor.ports_up", DEV, "rtlplayground", "Ports up", "3");
add("sensor.uptime", DEV, "rtlplayground", "Uptime", "1305");
add("sensor.temp", DEV, "rtlplayground", "Chip temperature", "75.0");
add("sensor.fw", DEV, "rtlplayground", "Firmware version", "v0.1.0-example");
add("sensor.ip", DEV, "rtlplayground", "IP address", "192.0.2.10");
add("sensor.mac", DEV, "rtlplayground", "MAC address", "02:00:00:00:00:01");
add("switch.night", DEV, "rtlplayground", "Night mode", "off");
for (const n of [1, 2, 3, 4]) {
  add(`binary_sensor.poe${n}_powered`, POE, "esphome", `Port ${n} PoE powered`, n <= 2 ? "on" : "off");
  add(`binary_sensor.poe${n}_oc`, POE, "esphome", `Port ${n} overcurrent`, "off");
  add(`binary_sensor.poe${n}_fault`, POE, "esphome", `Port ${n} startup fault`, "off");
  add(`sensor.poe${n}_v`, POE, "esphome", `Port ${n} voltage`, "54.0");
  add(`switch.poe${n}_ctl`, POE, "esphome", `PoE Port ${n}`, "on");
}
add("sensor.poe_power", POE, "esphome", "PoE total power", "21.3");
add("sensor.poe_current", POE, "esphome", "PoE total current", "383");

const q = new URLSearchParams(location.search);
if (q.get("unavail")) for (const r of reg) if (r.device_id === DEV) st[r.entity_id].state = "unavailable";
const hass = {
  states: st,
  entities: reg.map((r) => ({ entity_id: r.entity_id, device_id: r.device_id, platform: r.platform, name: r.name })),
  callWS: () => Promise.reject(new Error("no history in test")),
  callService: async () => {},
};
const card = document.getElementById("card");
card.setConfig({ title: "Test switch", poe_device_id: POE, poe_budget_w: 60 });
if (q.get("select")) card._selected = Number(q.get("select"));
card.hass = hass;
window.__done = true;
</script>
</body></html>
